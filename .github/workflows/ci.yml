name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ocl-icd-opencl-dev opencl-headers pocl-opencl-icd libopencv-dev libboost-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFLOWGUARD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test with PoCL CPU OpenCL
        run: ctest --test-dir build --output-on-failure
      - name: Build web dashboard
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
